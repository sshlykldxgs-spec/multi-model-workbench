[project]
name = "workbench-backend"
version = "0.0.1"
description = "多模型工作台 · 后端"
requires-python = ">=3.11"
dependencies = [
    # --- Web ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",

    # --- 数据 ---
    "sqlalchemy[asyncio]>=2.0.36",
    # 以下三个仅在连库路径用到；P0 的 mock 链路不需要它们
    "alembic>=1.14",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    # [email] 额外依赖是必需的：schemas/auth.py 用了 EmailStr，
    # 不声明它则 app.main 无法导入（实测报 "email-validator is not installed"）。
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",

    # --- 安全 ---
    # argon2 密码哈希；itsdangerous 用于会话 Cookie 签名
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",

    # --- 模型接入 ---
    # 中转站以 OpenAI 兼容协议为主，官方 SDK 是协议适配器的底座。
    # R-3：厂商 SDK 只允许出现在 app/gateway/protocols/ 内。
    "openai>=1.54",
    "anthropic>=0.39",
    "google-genai>=0.8",

    # --- 可观测 ---
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",

    # --- 编排层（仅 app/orchestrator/ 内可 import，见 importlinter 契约）---
    # MAF 版本以 `uv pip index versions agent-framework` 实测为准后再锁。
    # 蓝图与 design.md 12.1 均记载：各索引源对最新版说法不一。
    "agent-framework>=1.0.1",
]

[project.optional-dependencies]
# 代码沙箱与 OpenCodeReview 不在后端依赖里，它们是沙箱镜像的事。
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",       # FastAPI TestClient 的底座
    "ruff>=0.7",
    "pyright>=1.1.390",
    "import-linter>=2.0",
]

[tool.uv]
package = false

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = [
    "S101",  # assert：测试里要用
    # RUF001/2/3 是「易混淆 Unicode 字符」检查，例如全角括号（）与 ASCII () 形近。
    # 本项目的注释与文档字符串**刻意用中文全角标点**，这是写作规范而非疏忽，
    # 所以这三条在本项目恒为噪声（实测 497 个错误里有 481 个来自它们）。
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
# 本项目的测试全部是同步的（TestClient + pytest.raises），
# 所以不设 asyncio_mode，也不需要 pytest-asyncio。
# 将来若要写异步测试，再引入插件并显式声明 asyncio_mode。
testpaths = ["tests"]
filterwarnings = ["error"]

# ---------------------------------------------------------------- pyright
[tool.pyright]
include = ["app", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

# ---------------------------------------------------------------- 分层契约
# 这是 design.md R-1 与 R-3 的机械强制手段。
# 不靠自觉：任何人（或 AI）在业务代码里 import MAF 或厂商 SDK，CI 直接失败。
[tool.importlinter]
root_packages = ["app"]

# 说明：外部 SDK 的位置约束（R-1 的 MAF、R-3 的厂商 SDK）**不在这里查**。
# 开启 include_external_packages 后 lint-imports 会追踪传递依赖链，
# 于是 app.core.deps（只 import 了我们的 registry）会被判成「import 了 openai」——
# 实测 app.api 与 app.core 全部误报。
# 真实规则是「**直接** import 才受限」，import-linter 表达不了，故改由
# app/scripts/check_layering.py 用 AST 精确检查。

[[tool.importlinter.contracts]]
name = "依赖只能单向向下：下层不得依赖 api 与 middleware"
type = "forbidden"
source_modules = [
    "app.orchestrator",
    "app.gateway",
    "app.tools",
    "app.knowledge",
    "app.models",
    "app.schemas",
    "app.core",
]
forbidden_modules = ["app.api", "app.middleware"]

