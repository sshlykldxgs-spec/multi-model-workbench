name: 后端门禁

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: workbench
          POSTGRES_PASSWORD: workbench
          POSTGRES_DB: workbench
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://workbench:workbench@localhost:5432/workbench
      SESSION_SECRET: ci-secret-not-for-production
      OTEL_EXPORTER_OTLP_ENDPOINT: ""

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --extra dev

      # 蓝图第 10 节要求门禁不过不算完成。这里是七道，任一不过即失败。
      - name: 门禁 1 · 格式
        run: uv run ruff format --check .

      - name: 门禁 2 · 代码检查
        run: uv run ruff check .

      - name: 门禁 3 · 类型检查
        run: uv run pyright

      # 门禁 4 与 5 是**两道**，缺一不可：
      #   lint-imports 查层内依赖方向（只看我们自己包之间）
      #   check_layering 查厂商 SDK 的位置（R-1 的 MAF、R-3 的 openai/anthropic/google）
      # 为什么不用 lint-imports 一起查外部 SDK：它开启 include_external_packages 后
      # 会追踪传递依赖链，app.core.deps 只 import 了我们的 registry 却被判成
      # "import 了 openai"，实测 app.api 与 app.core 全部误报。
      # 而 R-3 的真实语义是"直接 import 才受限"，只能自己写 AST 检查。
      - name: 门禁 4 · 分层依赖方向
        run: uv run lint-imports

      - name: 门禁 5 · 厂商 SDK 与 MAF 的位置（R-1 / R-3）
        run: uv run python -m app.scripts.check_layering

      - name: 门禁 6 · 单元测试
        run: uv run pytest -q

      - name: 门禁 7 · OpenAPI 与契约一致
        run: uv run python -m app.scripts.check_contract
